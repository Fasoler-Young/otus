syntax = "proto3";

package ru.otus.protobuf;

option java_multiple_files = true;

message SequenceRange {
    int64 firstValue = 1;
    int64 lastValue = 2;
}

message SequenceCurValue {
    int64 value = 1;
}

service RemoteSequenceService {
    rpc getSequence(SequenceRange) returns (stream SequenceCurValue);
}
